name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Drop a file
        3. ...
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Name, size and where it comes from. Attach it if you can share it.
      placeholder: robot.glb, 12 MB, exported from Blender 4.2
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Open the browser dev tools console and paste any errors.
